<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 15: Tarjetas Flash de Fútbol</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="contenedor-principal">
        <div class="tarjeta-contenedor">
            <div style="font-weight: bold; margin-bottom: 12px; font-size: 18px;">Tarjetas Flash</div>
            
            <div class="barra-progreso-contenedor">
                <div id="progressBar" class="barra-progreso"></div>
            </div>
            
            <div class="cabecera-info">
                <span id="progressPercentage">5%</span>
                <span id="cardCount">1 de 20</span>
            </div>

            <div id="flashcard" class="tarjeta-flash">
                ¿Qué selección ha ganado más Copas del Mundo de la FIFA?
            </div>

            <div class="botones-navegacion">
                <button id="prevBtn" onclick="prevCard()">&lt; Anterior</button>
                <button id="actionBtn" class="boton-accion" onclick="toggleAnswer()">Mostrar Respuesta</button>
                <button id="nextBtn" onclick="nextCard()">Siguiente &gt;</button>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
